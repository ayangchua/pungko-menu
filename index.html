<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pungko Cafe | Caffeine Expert</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #3e563f; color: #ffffff; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .pungko-card { background: #fdfbf7; color: #3e563f; min-height: 85vh; width: 95%; max-width: 500px; display: flex; flex-direction: column; justify-content: center; position: relative; padding: 2rem; border-[12px] border-[#344935]; border-radius: 3rem; }
        .btn-red { background-color: #d14343; color: white; }
        .btn-yellow { background-color: #f1c27d; color: #3e563f; }
        .btn-outline { border: 3px solid #3e563f; color: #3e563f; font-weight: 800; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        .caffeine-tag { font-size: 8px; font-weight: 900; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; margin-top: 4px; display: inline-block; }
        .high-caf { background: #d14343; color: white; }
        .med-caf { background: #3e563f; color: white; }
        .low-caf { background: #f1c27d; color: #3e563f; }
    </style>
</head>
<body>

    <div id="app-container" class="pungko-card text-center shadow-2xl">
        </div>

    <script>
        // --- DATA ORGANIZED BY CAFFEINE LEVEL ---
        const menuDB = {
            'coffee': [
                { name: "Iced Americano", caf: "HIGH", level: 3, price: "100", oz: "16oz", desc: "Pure caffeine. The ultimate morning kickstarter." },
                { name: "Spanish Latte", caf: "HIGH", level: 3, price: "140", oz: "16oz", desc: "Bold espresso balanced with sweet condensed milk." },
                { name: "Salted Caramel", caf: "MED", level: 2, price: "145", oz: "16oz", desc: "Rich flavor with a moderate caffeine punch." },
                { name: "Cafe Latte", caf: "MED", level: 2, price: "120", oz: "16oz", desc: "Smooth, milky, and easy-going." },
                { name: "Cappuccino", caf: "MED", level: 2, price: "120", oz: "12oz", desc: "Classic foam with a standard espresso shot." }
            ],
            'tea': [
                { name: "Coconut Cloud Matcha", caf: "MED", level: 2, price: "165", oz: "16oz", desc: "Clean tea energy with a creamy coconut finish." },
                { name: "Matcha La Presa", caf: "MED", level: 2, price: "165", oz: "16oz", desc: "Earthy matcha energy meets sweet strawberry." },
                { name: "Hojicha Latte", caf: "LOW", level: 1, price: "140", oz: "16oz", desc: "Roasted tea. Very low caffeine, deeply relaxing." }
            ],
            'milk': [
                { name: "La Presa (Strawberry)", caf: "NONE", level: 0, price: "150", oz: "16oz", desc: "Zero caffeine. Just fresh fruit and milk." },
                { name: "Mango Milk", caf: "NONE", level: 0, price: "150", oz: "16oz", desc: "Zero caffeine. Tropical and creamy." }
            ]
        };

        function render(html, showHome = true) {
            const nav = showHome ? `<button onclick="showStart()" class="absolute top-8 right-8 text-[#3e563f] opacity-30 hover:opacity-100"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg></button>` : '';
            document.getElementById('app-container').innerHTML = `${nav}<div class="fade-in">${html}</div>`;
        }

        function showStart() {
            render(`
                <h1 class="text-[10px] font-black uppercase tracking-[0.4em] mb-2 opacity-50">Est. 2026</h1>
                <h2 class="text-4xl font-black uppercase mb-1 tracking-tighter">PUNGKO CAFE</h2>
                <p class="text-[11px] font-bold italic mb-10 tracking-widest text-[#d14343]">KAPE, KWENTO, AT GOOD VIBES LANG.</p>
                <div class="grid gap-4">
                    <button onclick="startQuiz(1)" class="btn-red p-8 rounded-3xl text-xl font-black shadow-lg uppercase">Surprise Me ✨</button>
                    <button onclick="browseMenu()" class="btn-yellow p-6 rounded-3xl text-md font-black uppercase">Full Menu</button>
                </div>
            `, false);
        }

        // --- 4 STEP QUIZ ---
        function startQuiz(step) {
            if (step === 1) {
                render(`<h2 class="text-3xl font-black mb-8 uppercase italic text-[#3e563f]">How's your energy?</h2>
                <div class="grid gap-4">
                    <button onclick="state.needsCaf=true; startQuiz(2)" class="btn-outline p-6 rounded-2xl text-lg uppercase">Zombie (Need Caffeine!)</button>
                    <button onclick="state.needsCaf=false; startQuiz(2)" class="btn-outline p-6 rounded-2xl text-lg uppercase">Chillin' (Low/No Caf)</button>
                </div>`);
            } else if (step === 2) {
                render(`<h2 class="text-3xl font-black mb-8 uppercase italic text-[#3e563f]">Temp?</h2>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="state.temp='hot'; startQuiz(3)" class="btn-red p-10 rounded-3xl font-black uppercase">Mainit</button>
                    <button onclick="state.temp='iced'; startQuiz(3)" class="btn-yellow p-10 rounded-3xl font-black uppercase">Malamig</button>
                </div>`);
            } else if (step === 3) {
                render(`<h2 class="text-2xl font-black mb-8 uppercase italic text-[#3e563f]">Sweetness?</h2>
                <div class="grid gap-4">
                    <button onclick="state.sweet=true; startQuiz(4)" class="btn-outline p-6 rounded-2xl text-lg uppercase">Dessert Vibes</button>
                    <button onclick="state.sweet=false; startQuiz(4)" class="btn-outline p-6 rounded-2xl text-lg uppercase">Balanced/Bold</button>
                </div>`);
            } else if (step === 4) {
                render(`<h2 class="text-3xl font-black mb-8 uppercase italic text-[#3e563f]">Texture?</h2>
                <div class="grid gap-4">
                    <button onclick="finishQuiz()" class="btn-red p-6 rounded-2xl text-lg uppercase font-black">Creamy & Velvety</button>
                    <button onclick="finishQuiz()" class="btn-yellow p-6 rounded-2xl text-lg uppercase font-black">Light & Refreshing</button>
                </div>`);
            }
        }

        function finishQuiz() {
            const cat = state.needsCaf ? 'coffee' : 'tea';
            showResults(cat);
        }

        function browseMenu() {
            render(`
                <h2 class="text-2xl font-black mb-8 uppercase text-[#3e563f]">Pick a Category:</h2>
                <div class="grid gap-4">
                    <button onclick="showResults('coffee')" class="btn-outline p-5 rounded-2xl font-black uppercase text-sm">Coffee (High Caffeine)</button>
                    <button onclick="showResults('tea')" class="btn-outline p-5 rounded-2xl font-black uppercase text-sm">Matcha/Tea (Med Caffeine)</button>
                    <button onclick="showResults('milk')" class="btn-outline p-5 rounded-2xl font-black uppercase text-sm">Milk Series (Zero Caffeine)</button>
                </div>
            `);
        }

        function showResults(cat) {
            const items = menuDB[cat];
            let listHtml = items.map(i => {
                const tagClass = i.caf === 'HIGH' ? 'high-caf' : (i.caf === 'MED' ? 'med-caf' : 'low-caf');
                return `
                <div class="p-4 bg-white border-2 border-stone-100 rounded-2xl mb-3 text-left shadow-sm">
                    <div class="flex justify-between items-start">
                        <h3 class="font-black text-[#3e563f] uppercase text-sm leading-tight">${i.name}</h3>
                        <span class="font-black text-[#d14343] text-sm">₱${i.price}</span>
                    </div>
                    <p class="text-[9px] text-stone-400 italic mb-1">${i.oz} | ${i.desc}</p>
                    <span class="caffeine-tag ${tagClass}">${i.caf} CAFFEINE</span>
                </div>`;
            }).join('');

            render(`
                <h2 class="text-xl font-black mb-6 uppercase text-[#3e563f]">${cat} Selections:</h2>
                <div class="max-h-72 overflow-y-auto mb-6 px-2">${listHtml}</div>
                <div class="p-3 bg-[#3e563f] text-[#fdfbf7] rounded-xl text-[10px] text-left mb-6 italic leading-tight">
                    ⚠️ Note: Both coffee and matcha contain caffeine. Hojicha has significantly lower caffeine levels.
                </div>
                <button onclick="showStart()" class="text-[#3e563f] font-black text-xs uppercase tracking-widest border-b-2 border-[#d14343] pb-1">Start Over</button>
            `);
        }

        let state = {};
        showStart();
    </script>
</body>
</html>
