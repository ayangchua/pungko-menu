<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pungko Cafe | Homey Vibes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #3e563f; color: #ffffff; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .pungko-card { background: #fdfbf7; color: #3e563f; min-height: 85vh; width: 95%; max-width: 500px; display: flex; flex-direction: column; justify-content: center; position: relative; padding: 2rem; border-[12px] border-[#344935]; border-radius: 3rem; }
        .btn-warm { background-color: #3e563f; color: white; border-radius: 1.5rem; transition: transform 0.2s; }
        .btn-warm:active { transform: scale(0.95); }
        .btn-accent { background-color: #d14343; color: white; border-radius: 1.5rem; }
        .btn-outline { border: 2px solid #e5e7eb; color: #3e563f; font-weight: 800; border-radius: 1.2rem; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .tag { font-size: 9px; font-weight: 900; padding: 3px 8px; border-radius: 20px; text-transform: uppercase; }
        .high { background: #fee2e2; color: #d14343; }
        .mid { background: #dcfce7; color: #3e563f; }
        .zero { background: #f3f4f6; color: #6b7280; }
    </style>
</head>
<body>

    <div id="app-container" class="pungko-card text-center shadow-2xl"></div>

    <script>
        const menuDB = [
            { name: "Americano", cat: "coffee", caf: "High", level: 3, price: "145", vibe: "bold", desc: "Straight coffee to wake you right up!" },
            { name: "Spanish Latte", cat: "coffee", caf: "High", level: 3, price: "170", vibe: "sweet", desc: "Creamy, sweet, and very satisfying." },
            { name: "Caramel Macchiato", cat: "coffee", caf: "High", level: 3, price: "170", vibe: "sweet", desc: "Layers of vanilla, milk, and caramel." },
            { name: "Biscoff Latte", cat: "coffee", caf: "High", level: 3, price: "210", vibe: "dessert", desc: "Like a cookie in a coffee cup!" },
            { name: "Dirty Matcha", cat: "coffee", caf: "High", level: 3, price: "190", vibe: "earthy", desc: "Coffee meets green tea. The best of both." },
            { name: "Matcha Latte", cat: "tea", caf: "Mid", level: 2, price: "170", vibe: "earthy", desc: "Healthy, green, and super chill energy." },
            { name: "Hojicha Latte", cat: "tea", caf: "Low", level: 1, price: "140", vibe: "earthy", desc: "Roasted tea that tastes like toasted nuts." },
            { name: "Ube Latte", cat: "milk", caf: "None", level: 0, price: "195", vibe: "dessert", desc: "Purple yam goodness. No caffeine!" },
            { name: "Strawberry Latte", cat: "milk", caf: "None", level: 0, price: "170", vibe: "sweet", desc: "Fresh, fruity, and feels like summer." },
            { name: "Signature Chocolate", cat: "milk", caf: "None", level: 0, price: "160", vibe: "sweet", desc: "Warm comfort for your soul." }
        ];

        let state = {};

        function render(html) {
            document.getElementById('app-container').innerHTML = `<div class="fade-in">${html}</div>`;
        }

        function showStart() {
            render(`
                <h1 class="text-[10px] font-black uppercase tracking-[0.3em] mb-2 opacity-40">Welcome Home</h1>
                <h2 class="text-4xl font-black uppercase mb-2 tracking-tighter">PUNGKO CAFE</h2>
                <p class="text-xs mb-10 opacity-70">Let's find the drink that fits your mood today. ✨</p>
                <div class="grid gap-4">
                    <button onclick="quiz(1)" class="btn-accent p-6 text-lg font-black uppercase shadow-lg">Find My Drink</button>
                    <button onclick="showFullMenu()" class="btn-outline p-4 uppercase text-sm">Just Browsing</button>
                </div>
            `);
        }

        function quiz(step) {
            if (step === 1) {
                render(`
                    <h2 class="text-2xl font-black mb-6">How much of a "kick" do you need? ⚡</h2>
                    <div class="space-y-3">
                        <button onclick="state.caf=3; quiz(2)" class="w-full btn-outline p-5 text-left">
                            <b class="block">Fully Awake</b> <span class="text-[10px] font-normal">I need that coffee energy!</span>
                        </button>
                        <button onclick="state.caf=2; quiz(2)" class="w-full btn-outline p-5 text-left">
                            <b class="block">Gentle Spark</b> <span class="text-[10px] font-normal">Give me some Matcha or Tea vibes.</span>
                        </button>
                        <button onclick="state.caf=0; quiz(2)" class="w-full btn-outline p-5 text-left">
                            <b class="block">Just Relaxing</b> <span class="text-[10px] font-normal">No caffeine, just pure flavor.</span>
                        </button>
                    </div>
                `);
            } else if (step === 2) {
                render(`
                    <h2 class="text-2xl font-black mb-6">How's the weather for you? 🌡️</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="state.temp='hot'; quiz(3)" class="btn-accent p-10 font-black uppercase">Warm &<br>Cozy</button>
                        <button onclick="state.temp='iced'; quiz(3)" class="btn-warm p-10 font-black uppercase">Ice<br>Cold</button>
                    </div>
                `);
            } else if (step === 3) {
                render(`
                    <h2 class="text-2xl font-black mb-6">What sounds tasty? 😋</h2>
                    <div class="grid gap-3">
                        <button onclick="state.vibe='sweet'; finish()" class="btn-outline p-4 text-left">Sweet & Creamy</button>
                        <button onclick="state.vibe='bold'; finish()" class="btn-outline p-4 text-left">Strong & Coffee-flavored</button>
                        <button onclick="state.vibe='earthy'; finish()" class="btn-outline p-4 text-left">Natural & Earthy (Tea vibes)</button>
                        <button onclick="state.vibe='dessert'; finish()" class="btn-outline p-4 text-left">Indulgent Dessert vibes</button>
                    </div>
                `);
            }
        }

        function finish() {
            // Find matches
            let matches = menuDB.filter(i => {
                if (state.caf > 0 && i.level === 0) return false;
                if (state.caf === 0 && i.level > 0) return false;
                return true;
            });

            // Sort by vibe match
            matches.sort((a,b) => (a.vibe === state.vibe ? -1 : 1));
            const pick = matches[0];

            render(`
                <p class="text-xs font-black text-[#d14343] uppercase mb-2">Our recommendation for you:</p>
                <h2 class="text-4xl font-black uppercase mb-4">${pick.name}</h2>
                <div class="bg-white p-6 rounded-[2rem] border-2 border-stone-100 mb-6 shadow-sm">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-2xl font-black">₱${pick.price}</span>
                        <span class="tag ${pick.level > 1 ? 'high' : 'mid'}">${pick.caf} Caffeine</span>
                    </div>
                    <p class="text-sm italic opacity-80 text-left">"${pick.desc}"</p>
                </div>
                <div class="space-y-4">
                    <button onclick="showStart()" class="w-full btn-warm p-4 font-black uppercase">Perfect, Thanks!</button>
                    <button onclick="showFullMenu()" class="text-xs font-black uppercase tracking-widest border-b-2 border-[#d14343] pb-1">Show Me Everything</button>
                </div>
            `);
        }

        function showFullMenu() {
            const list = menuDB.sort((a,b) => b.level - a.level).map(i => `
                <div class="flex justify-between items-center py-4 border-b border-stone-100 text-left">
                    <div>
                        <h4 class="font-black text-sm uppercase">${i.name}</h4>
                        <p class="text-[10px] opacity-50">${i.caf} Caffeine • ${i.vibe}</p>
                    </div>
                    <span class="font-black text-[#d14343]">₱${i.price}</span>
                </div>
            `).join('');

            render(`
                <h2 class="text-2xl font-black mb-4 uppercase">The Menu</h2>
                <div class="max-h-80 overflow-y-auto px-2 mb-6">${list}</div>
                <button onclick="showStart()" class="w-full btn-warm p-4 font-black uppercase">Back to Start</button>
            `);
        }

        showStart();
    </script>
</body>
</html>
